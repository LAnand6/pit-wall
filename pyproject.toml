[project]
name = "pit-wall"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.3",
    "redis>=8.1",
    "rq>=2.12",
    "fastf1>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17", "jupyter"]

[tool.setuptools]
packages = ["app", "ingest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
